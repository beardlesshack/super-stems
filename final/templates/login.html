{% extends "layout.html" %}
{% block title %}Sign in · NameSprouts{% endblock %}
{% block content %}
<main class="account-form-page">
  <section class="account-form-card">
    <p class="eyebrow">Welcome back</p>
    <h1>Sign in to NameSprouts</h1>
    <p>Pick up where you left off in your garden.</p>
    <form method="POST" action="{{ url_for('login') }}" class="account-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="username">Username</label><input type="text" id="username" name="username" autocomplete="username" required>
      <label for="password">Password</label><input type="password" id="password" name="password" autocomplete="current-password" required>
      <button type="submit" class="button button-primary full-button">Sign in</button>
    </form>
    <p class="form-footnote">New to NameSprouts? <a href="{{ url_for('register') }}">Create a free account</a></p>
  </section>
</main>
{% endblock %}
