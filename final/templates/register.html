{% extends "layout.html" %}
{% block title %}Create your free account · NameSprouts{% endblock %}
{% block content %}
<main class="account-form-page">
  <section class="account-form-card">
    <p class="eyebrow">Your garden, saved</p>
    <h1>Create a free account</h1>
    <p>Save your proof, come back to edit it, and approve it when you are ready.</p>
    <form method="POST" action="{{ url_for('register') }}" class="account-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="username">Username</label><input type="text" id="username" name="username" maxlength="40" autocomplete="username" required>
      <label for="email">Email</label><input type="email" id="email" name="email" maxlength="254" autocomplete="email" required>
      <label for="password">Password</label><input type="password" id="password" name="password" minlength="8" autocomplete="new-password" required>
      <button type="submit" class="button button-primary full-button">Create free account</button>
    </form>
    <p class="form-footnote">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
  </section>
</main>
{% endblock %}
