<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Super Stems · Dennis</title>
  <link rel="stylesheet" href="stem-preview.css">
  <script src="stem-renderer.js" defer></script>
</head>
<body>
  <main class="review-page">
    <header class="intro">
      <p class="eyebrow">SUPER STEMS · DESIGN REVIEW</p>
      <h1>A name that grows from the flower</h1>
      <p class="intro-copy">One rose, one name. Dennis follows a gently curved stem sized to the lettering.</p>
    </header>

    <figure class="proof">
      <svg id="stem-proof" viewBox="0 0 900 680" role="img" aria-labelledby="proof-title proof-description">
        <title id="proof-title">Dennis written along a rose stem</title>
        <desc id="proof-description">A watercolor June rose with the name Dennis flowing upward along a softly curved stem.</desc>
        <defs>
          <linearGradient id="stem-color" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#74866a" stop-opacity=".58"></stop>
            <stop offset=".5" stop-color="#536b4f" stop-opacity=".86"></stop>
            <stop offset="1" stop-color="#829273" stop-opacity=".55"></stop>
          </linearGradient>
        </defs>
        <image class="paper-image" href="../final/static/images/watercolor-paper-bg.png" x="0" y="0" width="900" height="680" preserveAspectRatio="xMidYMid slice"></image>
        <g id="plant-art"></g>
      </svg>
      <figcaption>
        <span>DENNIS · JUNE ROSE</span>
        <span id="render-note" aria-live="polite">Shaping the stem…</span>
      </figcaption>
    </figure>

    <p class="design-note">The word is measured in the script font, then fitted to the natural curve. Longer lettering extends the stem instead of being squeezed smaller.</p>
  </main>
</body>
</html>
